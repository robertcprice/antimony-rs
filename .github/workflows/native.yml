# Native-only gates. These jobs are configured, not evidence that remote OS jobs ran.
# Primary references: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://github.com/actions/checkout and https://rust-lang.github.io/rustup/basics.html
name: Native Rust
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.96.0', stable]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned 2026-10-10
        with:
          persist-credentials: false
      - name: Install requested native toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Check and build
        run: |
          cargo check --locked --all-targets --all-features
          cargo build --locked --all-targets --all-features
      - name: Native tests and documentation tests
        run: |
          cargo test --locked --all-targets --all-features
          cargo test --locked --doc --all-features
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features cli
      - name: Strict lint and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features cli -- -D warnings
          cargo doc --locked --no-deps --all-features
      - name: Offline rebuild and package inventory
        run: |
          cargo build --locked --offline --all-targets --all-features
          cargo build --locked --offline --no-default-features --features cli --bin antimony
          cargo package --list --allow-dirty
# No Python, libAntimony, oracle installation, publishing, or remote writes here.
